# EfficientNet-B0 — glioma-upweighted run (Stage: response to the augaffine
# ep13 result: test acc/macro-recall 0.9619, glioma recall 0.858 vs
# meningioma 0.990; glioma->meningioma drift is 47 of 61 test misses).
#
# Strategy: keep the proven augaffine augmentation stack (random
# translation A+/-8% + rotation 15° + hflip + photometric) and add a
# moderate class weighting that pulls glioma recall up. Classes are
# balanced in frequency, so the weight is a pure decision-threshold /
# loss-strength lever, not a rebalance of sampling (no oversampling needed).
#
# Selection rules unchanged: val macro-recall driver, early stopping,
# test set exactly once for the final pick.

_base_: efficientnet_b0_augaffine.yaml

training:
  class_weights: [1.3, 1.0, 1.0, 1.0]  # order = data.classes: glioma, meningioma, notumor, pituitary

logging:
  checkpoint_dir: "models/run_gliomaw"

experiment_name: "efficientnet_b0_gliomaw"
